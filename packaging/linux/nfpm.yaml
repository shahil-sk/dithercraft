# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: dithercraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.9.0-rc.1 becomes 0.9.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: ${DITHERCRAFT_MAINTAINER:-DitherCraft Maintainers <maintainers@dithercraft.org>}
vendor: DitherCraft
homepage: https://github.com/shahil-sk/dithercraft
license: MIT OR Apache-2.0
description: |-
  Open-source, studio-grade retro graphical dithering and CRT effects workstation.
  63 dithering algorithms, JPEG glitch core, pop tone, CMYK halftone separations,
  and black vector isolation SVG export.
  Includes dithercraft-cli, a high-throughput streaming tool.

overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/dithercraft
    dst: /usr/bin/dithercraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/dithercraft-cli
    dst: /usr/bin/dithercraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
