name: Build & Package Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.9.0)"
        type: string
        default: ""
      release:
        description: "Publish GitHub Release (for manual triggers)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Parse version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          fi
          v="${v#v}"
          if [[ "$v" == *"-"* ]]; then
            pre=true
          else
            pre=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Target DitherCraft version: v$v" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux x86_64 Package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-pkg

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev

      - name: Build & Package Linux Release
        run: |
          cargo build --release -p dithercraft -p dithercraft-cli
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist/release
          mkdir -p stage/bin stage/share/applications stage/share/icons/hicolor/256x256/apps
          cp target/release/dithercraft stage/bin/
          cp target/release/dithercraft-cli stage/bin/
          cp packaging/linux/io.github.dithercraft.desktop stage/share/applications/
          cp assets/app-icon/hicolor/256x256/apps/io.github.dithercraft.png stage/share/icons/hicolor/256x256/apps/

          # Package FHS tarball
          tar -czf dist/release/dithercraft-${VER}-linux-x86_64.tar.gz -C stage bin share

          # Standalone binaries
          cp target/release/dithercraft dist/release/dithercraft-${VER}-linux-x86_64
          cp target/release/dithercraft-cli dist/release/dithercraft-cli-${VER}-linux-x86_64
          ls -la dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: dithercraft-linux-x86_64
          path: dist/release/*

  windows:
    name: Windows x86_64 Package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-pkg

      - name: Build & Package Windows Release
        shell: bash
        run: |
          cargo build --release -p dithercraft -p dithercraft-cli
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist/release
          mkdir -p stage
          cp target/release/dithercraft.exe stage/
          cp target/release/dithercraft-cli.exe stage/
          cp assets/app-icon/dithercraft.ico stage/

          # Package Zip archive
          7z a dist/release/dithercraft-${VER}-windows-x86_64.zip ./stage/*

          # Standalone binaries
          cp target/release/dithercraft.exe dist/release/dithercraft-${VER}-windows-x86_64.exe
          cp target/release/dithercraft-cli.exe dist/release/dithercraft-cli-${VER}-windows-x86_64.exe
          ls -la dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: dithercraft-windows-x86_64
          path: dist/release/*

  macos:
    name: macOS Universal Package
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-pkg

      - name: Build & Package macOS Universal Release
        run: |
          cargo build --release --target aarch64-apple-darwin -p dithercraft -p dithercraft-cli
          cargo build --release --target x86_64-apple-darwin -p dithercraft -p dithercraft-cli
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist/release universal-bin

          # Universal binaries
          lipo -create -output universal-bin/dithercraft \
            target/aarch64-apple-darwin/release/dithercraft \
            target/x86_64-apple-darwin/release/dithercraft
          lipo -create -output universal-bin/dithercraft-cli \
            target/aarch64-apple-darwin/release/dithercraft-cli \
            target/x86_64-apple-darwin/release/dithercraft-cli

          # Bundle DitherCraft.app
          APP="dist/DitherCraft.app/Contents"
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp universal-bin/dithercraft "$APP/MacOS/DitherCraft"
          cp universal-bin/dithercraft-cli "$APP/MacOS/dithercraft-cli"
          cp assets/app-icon/dithercraft.icns "$APP/Resources/DitherCraft.icns"

          sed "s/@VERSION@/${VER}/g; s/@SHORT_VERSION@/${VER%%-*}/g; s/@BUILD_SHA@/${GITHUB_SHA}/g" \
            packaging/macos/Info.plist.in > "$APP/Info.plist"

          # Package Zip of .app
          (cd dist && zip -r "release/dithercraft-${VER}-macos-universal.zip" DitherCraft.app)

          # Standalone binaries
          cp universal-bin/dithercraft dist/release/dithercraft-${VER}-macos-universal
          cp universal-bin/dithercraft-cli dist/release/dithercraft-cli-${VER}-macos-universal
          ls -la dist/release/

      - uses: actions/upload-artifact@v4
        with:
          name: dithercraft-macos-universal
          path: dist/release/*

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Flatten Artifacts & Generate Checksums
        run: |
          mkdir -p release-artifacts
          find dist-all -type f -exec cp {} release-artifacts/ \;
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DitherCraft v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          draft: false
          files: release-artifacts/*
          generate_release_notes: true
