[package]
name = "dithercraft"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native hardware-accelerated desktop workstation for retro dithering, DSP and glitch effects."

[dependencies]
dither-core = { path = "../../crates/dither-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rayon = "1.10"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

