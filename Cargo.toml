[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "xtask",
]
default-members = [
    "crates/dither-core",
    "apps/dithercraft",
    "apps/dithercraft-cli",
    "xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
authors = ["DitherCraft Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/shahil-sk/dithercraft"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
debug = true
